# =============================================================================
# THE GREAT BOOK OF WORLD GAMES — KALİTE KAPILARI
# =============================================================================
# Her push'ta koşar. Kalite düşerse KIRMIZI yanar ve ilerleme durur.
#
# TASARIM: bu iş akışı ÜÇÜNCÜ TARAF PAKET KURMAZ. Bütün kalite kapıları
# Python standart kütüphanesiyle yazıldı; iş akışı saniyeler içinde biter.
# Yazım fazlarında günde onlarca push olur ve iki dakikalık kurulum beklemek
# disiplini öldürür. Ağır bağımlılıklar build.yml'e aittir.
# =============================================================================
name: validate

on:
  push:
    branches: [main, 'faz/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: kapı seviyesini oku
    runs-on: ubuntu-latest
    outputs:
      level: ${{ steps.read.outputs.level }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          LEVEL="phase0"
          if [ -f .gate ]; then LEVEL="$(tr -d '[:space:]' < .gate)"; fi
          case "$LEVEL" in
            phase0|phase1|phase2|phase3|phase4|phase5|release) ;;
            *) echo "::error::.gate geçersiz: '$LEVEL'"; exit 1 ;;
          esac
          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"
          echo "::notice::kapı seviyesi = $LEVEL"

  data:
    name: veri bütünlüğü ve kapsam
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # ÜRETİLEN ENVANTER EN BAŞTA: bayat bir indeksle koşan bütün kapılar
      # yanlış veriyi denetler ve yeşil yanabilir.
      - name: envanter parçalarla güncel mi
        run: |
          if [ -f 04_BUILD/build_index.py ]; then
            python3 04_BUILD/build_index.py --check --verbose
          else
            echo "::notice::build_index.py henüz yok — Faz 1 teslimatı"
          fi
      - name: şema, kimlik ve kapsam
        run: |
          python3 04_BUILD/validate_spec.py \
            --gate "${{ needs.gate.outputs.level }}" \
            --verbose --json 06_REPORTS/spec-validation.json
      - name: araştırma kayıtları (Faz 1'de doğar)
        run: |
          if [ -f 04_BUILD/validate_research.py ]; then
            python3 04_BUILD/validate_research.py --verbose --json 06_REPORTS/research.json
          else
            echo "::notice::validate_research.py henüz yok — Faz 1 teslimatı"
          fi
      - name: tasnif bütünlüğü (Faz 1'de doğar)
        run: |
          if [ -f 04_BUILD/qa_taxonomy.py ]; then
            python3 04_BUILD/qa_taxonomy.py --verbose --json 06_REPORTS/qa-taxonomy.json
          else
            echo "::notice::qa_taxonomy.py henüz yok — Faz 1 teslimatı"
          fi
      # KAPSAM KİLİDİ (Faz 2 · A3). İki şeyi birden korur: listenin kendisini
      # ve listenin ALTINDAKİ envanteri. İkincisi olmadan bir oyun sessizce
      # düşebilir ve hiçbir dosyada değişiklik görünmezdi.
      - name: kapsam ve pilot kilidi (Faz 2'de doğar)
        run: |
          if [ -f 04_BUILD/validate_scope.py ]; then
            python3 04_BUILD/validate_scope.py --verbose --json 06_REPORTS/scope-lock.json
          else
            echo "::notice::validate_scope.py henüz yok — Faz 2 teslimatı"
          fi
      # ÜRETİM KUYRUĞU SIRASI (Faz 4 · kurucu § 4). Kapsam kilidi listenin
      # NE olduğunu korur; bu kapı listenin HANGİ SIRAYLA işlendiğini korur.
      # Engelli bir oyun erişilebilir bir oyunun önüne geçerse üretim, açık
      # bir kaynak dururken kapalı bir kaynağı bekler.
      - name: üretim kuyruğu sırası (Faz 4'te doğar)
        run: |
          if [ -f 04_BUILD/build_queue.py ]; then
            python3 04_BUILD/build_queue.py --check
          else
            echo "::notice::build_queue.py henüz yok — Faz 4 teslimatı"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-reports
          path: 06_REPORTS/*.json
          if-no-files-found: ignore

  structure:
    name: depo, belge ve manuscript koruması
    runs-on: ubuntu-latest
    steps:
      # Sızıntı denetimi `git ls-files` okur — çalışan bir depo gerekir.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: yapı, belge ve sızıntı denetimi
        run: python3 04_BUILD/validate_structure.py --verbose --json 06_REPORTS/structure.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structure-report
          path: 06_REPORTS/structure.json
          if-no-files-found: ignore

  gates-selftest:
    name: KAPILARIN KENDİ TESTİ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # Bu, hattın EN ÖNEMLİ testidir. Metin yokken yeşil kalan bir hat,
      # kusur geldiğinde de yeşil kalabilir. Bu test o riski kapatır.
      - name: kapılar gerçekten ısırıyor mu
        run: python3 05_TESTS/selftest.py --verbose

  text:
    name: metin kalite kapıları
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: manuscript bu depoda var mı
        run: |
          if [ -f 02_MANUSCRIPT/book.json ]; then
            echo "::warning::02_MANUSCRIPT/book.json depoda GÖRÜNÜYOR — .gitignore § ① ihlali olabilir"
          else
            echo "::notice::manuscript depoda yok (.gitignore § ①) — metin kapıları boş koşar; körlüğü selftest kapatır"
          fi
      # ⚠ BU DÖNGÜ ELLE YAZILMIŞ BİR LİSTE DEĞİL, BİR TARAMADIR.
      # Faz 1'de dört kapı qa_all.sh'de koşuyordu ama CI'da KOŞMUYORDU —
      # yani yerelde ısıran bir kapı uzaktan sessiz kalıyordu (Codex dersi D5:
      # "bir kapının VARLIĞI, KOŞTUĞU anlamına gelmez"). Elle tutulan bir
      # liste bu kusuru geri getirir: yeni bir kapı yazılır, listeye
      # eklenmesi unutulur, CI sessizce eksik koşar.
      # Tarama bu sınıfı KAPATIR: 04_BUILD/qa_*.py ne varsa koşar.
      - name: metin ve içerik kapıları (tarama — elle liste YOK)
        run: |
          RAN=0
          shopt -s nullglob
          for f in 04_BUILD/qa_*.py; do
            g="$(basename "$f" .py)"
            echo "▸ $g"
            python3 "$f" --verbose --json "06_REPORTS/${g//_/-}.json" || exit 1
            RAN=$((RAN+1))
          done
          if [ "$RAN" -eq 0 ]; then
            echo "::error::hiçbir qa_*.py kapısı bulunamadı — tarama bozuk olabilir"
            exit 1
          fi
          echo "::notice::$RAN kapı koştu (tarama ile bulundu)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: text-qa-reports
          path: 06_REPORTS/qa-*.json
          if-no-files-found: ignore

  production-model:
    name: sayfa bütçesi ve telif modeli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # SAYFA BÜTÇESİ FİYAT MODELİNİN KENDİSİDİR: 256 yerine 300 sayfa,
      # her satılan kopyada telifi düşürür.
      - name: sürüm, telif ve sayfa bütçesi
        run: |
          for s in editions page_budget score_candidates; do
            if [ -f "04_BUILD/$s.py" ]; then
              python3 "04_BUILD/$s.py" --verbose --json "06_REPORTS/${s//_/-}.json" || exit 1
            else
              echo "::notice::$s.py henüz yok — Faz 1/2 teslimatı"
            fi
          done
      # DİZGİ ÖLÇÜMÜ AYRI KOŞAR VE `run_optional` SÖZLEŞMESİNE UYAR.
      # Çıkış kodu 2 = "bağımlılık yok, ATLANDI" ve bu bir KUSUR DEĞİLDİR;
      # reportlab kalite kapılarına değil dizgi işlerine aittir (karar K7).
      # CI'da ölçüm TEKRARLANMAZ — işlenmiş ölçümün tutarlılığı denetlenir;
      # ticari manuscript zaten depoda yoktur (A1).
      - name: gerçek dizgi ölçümü (--check · bağımlılık isteğe bağlı)
        run: |
          if [ ! -f 04_BUILD/calibrate_pages.py ]; then
            echo "::notice::calibrate_pages.py henüz yok — Faz 2 teslimatı"; exit 0
          fi
          set +e
          python3 04_BUILD/calibrate_pages.py --check \
            --json 06_REPORTS/phase2-typeset-measurement-check.json
          rc=$?
          set -e
          case $rc in
            0) echo "::notice::dizgi ölçümü tutarlı" ;;
            2) echo "::notice::reportlab yok — dizgi ölçümü ATLANDI (beklenen)" ;;
            *) echo "::error::dizgi ölçümü kapısı kırmızı"; exit 1 ;;
          esac
      # Üretilen belge bayatsa, okuyan ajan yanlış karar verir.
      # Disiplin unutulur, mekanizma unutmaz.
      - name: üretilen belgeler güncel mi
        run: |
          if [ -f 04_BUILD/update_docs.py ]; then
            python3 04_BUILD/update_docs.py --check --verbose
          else
            echo "::notice::update_docs.py henüz yok — Faz 1 teslimatı"
          fi

  summary:
    name: özet
    needs: [data, structure, gates-selftest, text, production-model]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
            echo "## The Great Book of World Games · kalite kapıları"
            echo ""
            echo "| Kapı | Sonuç |"
            echo "|---|---|"
            echo "| veri bütünlüğü ve kapsam | ${{ needs.data.result }} |"
            echo "| depo, belge, manuscript koruması | ${{ needs.structure.result }} |"
            echo "| **kapıların kendi testi** | ${{ needs.gates-selftest.result }} |"
            echo "| metin kapıları | ${{ needs.text.result }} |"
            echo "| sayfa bütçesi ve telif | ${{ needs.production-model.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            {
              echo ""
              echo "**Kalite düştü. Düzeltilmeden ilerleme yok.**"
              echo ""
              echo "Yerelde aynı komutlar: \`./04_BUILD/qa_all.sh\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
